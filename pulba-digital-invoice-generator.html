      <p class="panel-tagline">Invoice jasa Pembuatan website.</p>

      <label>Nama Pelanggan</label>
      <input id="customerName" value="">

      <label>Instansi / Perusahaan</label>
      <input id="customerCompany" value="">

      <label>Alamat Pelanggan</label>
      <textarea id="customerAddress"></textarea>

      <label>No. WhatsApp</label>
      <input id="customerPhone">

      <div class="grid2">
        <div>
          <label>Nomor Invoice</label>
          <input id="invoiceNumber">
        </div>
        <div>
          <label>Jatuh Tempo</label>
          <input id="dueDate" type="date">
        </div>
      </div>

      <label>Tanggal Invoice</label>
      <input id="invoiceDate" type="date">

      <label>Jenis Project</label>
      <select id="projectType" onchange="applyProjectPreset()">
        <option value="website">Jasa Pembuatan Website</option>
        <option value="undangan">Undangan Digital</option>
        <option value="custom">Project Custom</option>
      </select>

      <label>Nama Project</label>
      <input id="projectName" value="Pembuatan Website">

      <label>Catatan</label>
      <textarea id="notes">Terima kasih telah menggunakan layanan Pulba Digital.</textarea>

      <h3 style="font-size:14px;margin:20px 0 8px;color:#374151">Item Invoice</h3>
      <div id="itemsEditor"></div>
      <button class="secondary" style="width:100%" onclick="addItem()">+ Tambah Item</button>

      <div class="grid2">
        <div>
          <label>Adjustment</label>
          <input id="adjustment" type="number" value="0" oninput="renderInvoice()">
        </div>
        <div>
          <label>Diskon</label>
          <input id="discount" type="number" value="0" oninput="renderInvoice()">
        </div>
      </div>

      <div class="actions">
        <button class="primary" onclick="window.print()">Cetak / PDF</button>
        <button class="secondary" onclick="downloadPNG()">Simpan Image</button>
      </div>
      <button class="secondary" style="width:100%;margin-top:8px" onclick="saveData()">Simpan Draft</button>
      <button class="secondary" style="width:100%;margin-top:8px" onclick="loadData()">Muat Draft</button>
    </aside>

    <main class="stage">
      <section class="invoice" id="invoice">
